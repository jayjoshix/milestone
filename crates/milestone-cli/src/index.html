<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>milestone-spec — Pre-Listing Ambiguity Check</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --red-bg: #fef2f2;
    --red-fg: #991b1b;
    --red-bd: #fecaca;
    --green-bg: #ecfdf5;
    --green-fg: #065f46;
    --green-bd: #a7f3d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 72px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 18px;
    letter-spacing: -0.015em;
  }
  .prompt-row {
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    padding: 11px 14px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--sans);
    color: var(--text);
  }
  input[type="text"]:focus {
    outline: 2px solid #cbd5e1;
    border-color: #94a3b8;
  }
  button.primary {
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    background: #111827;
    color: #fff;
    border: 1px solid #111827;
    border-radius: 6px;
    cursor: pointer;
  }
  button.primary:hover { opacity: 0.9; }
  .presets {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
  }
  .preset-btn {
    font-size: 13px;
    padding: 4px 10px;
    background: #f3f4f6;
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    color: var(--text);
  }
  .preset-btn:hover { background: #e5e7eb; }
  .status-pill {
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid;
    margin-bottom: 14px;
  }
  .status-pill.bad { background: var(--red-bg); color: var(--red-fg); border-color: var(--red-bd); }
  .status-pill.ok { background: var(--green-bg); color: var(--green-fg); border-color: var(--green-bd); }
  .progress-note {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .question {
    font-size: 19px;
    font-weight: 600;
    margin: 6px 0 16px;
  }
  .label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .example-box {
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .outcomes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }
  .outcome-box {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 13px;
  }
  .outcome-box strong {
    display: block;
    font-family: var(--mono);
    margin-bottom: 4px;
  }
  .missing-rule {
    font-family: var(--mono);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .choice-btn {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
  }
  .choice-btn:hover {
    background: #111827;
    color: #ffffff;
    border-color: #111827;
  }
  .hash-box {
    font-family: var(--mono);
    font-size: 13px;
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    word-break: break-all;
    margin: 14px 0 18px;
  }
  .link-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .link-btn:hover { background: #f3f4f6; }
  .tech-panel {
    margin-top: 18px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  pre {
    background: #f3f4f6;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 12px;
    overflow-x: auto;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Can two reasonable resolvers disagree?</h1>
    <div class="prompt-row">
      <input id="headline" type="text" value="Will Acme raise $5M before Dec 31?" />
      <button class="primary" onclick="startAnalysis()">Analyze</button>
    </div>
    <div class="presets">
      <span>Try an example:</span>
      <button class="preset-btn" onclick="pickPreset('Will Acme raise $5M before Dec 31, 2027?')">Raise $5M</button>
      <button class="preset-btn" onclick="pickPreset('Will Acme reach $1M ARR by June 30, 2027?')">Reach $1M ARR</button>
      <button class="preset-btn" onclick="pickPreset('Will Acme be acquired for $100M or more by 2028?')">Be acquired for $100M</button>
    </div>
  </div>

  <div id="result-card" class="card hidden"></div>
</div>

<script>
let currentSpec = null;
let lastData = null;
let fixedCount = 0;
let showTechnical = false;

function pickPreset(text) {
  document.getElementById('headline').value = text;
  startAnalysis();
}

async function startAnalysis() {
  fixedCount = 0;
  showTechnical = false;
  const headline = document.getElementById('headline').value;
  const res = await fetch('/api/parse', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ headline })
  });
  const parsed = await res.json();
  if (!parsed.spec) {
    alert(parsed.note || 'Could not recognize headline pattern.');
    return;
  }
  currentSpec = parsed.spec;
  await refresh();
}

async function refresh() {
  const res = await fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ spec: currentSpec })
  });
  lastData = await res.json();
  currentSpec = lastData.spec;
  render();
}

function applyStepFix(kind, value) {
  const cp = currentSpec.predicate.class_policy;
  if (kind === 'completion_event') {
    cp.completion_event = value;
  } else if (kind === 'allowed_instruments') {
    cp.allowed_instruments = value;
    cp.include_secondary = false;
    cp.include_insider_capital = false;
    cp.include_existing_note_conversion = false;
    cp.tranche_policy = 'count_only_funded_tranches';
    cp.conditional_commitment_policy = 'exclude_conditional';
    cp.unwind_policy = 'must_remain_closed_through_finalization';
  } else if (kind === 'measurement_basis') {
    cp.measurement_basis = value;
  } else if (kind === 'arr_inclusions') {
    cp.include_services_revenue = value.services;
    cp.include_one_time_fees = false;
    cp.usage_based_treatment = 'excluded';
    cp.discount_treatment = 'net_of_discounts';
    cp.churn_treatment = 'exclude_churned_and_noticed';
    cp.signed_not_started_treatment = value.signedNotStarted;
    cp.subsidiary_scope = 'consolidated_group_with_subsidiaries';
  } else if (kind === 'acq_completion') {
    cp.completion_event = value;
    cp.termination_after_announcement_policy = 'resolves_no_if_terminated_before_close';
  } else if (kind === 'acq_consideration') {
    cp.earn_out_treatment = value;
    cp.valuation_basis = 'enterprise_value';
    cp.consideration_types = ['cash', 'public_stock'];
    cp.transaction_structures = ['whole_company_merger_or_acquisition', 'substantially_all_assets'];
  } else if (kind === 'evidence') {
    const srcType = value;
    currentSpec.evidence_policy = {
      primary_source: {
        name: 'Authoritative Primary Source',
        source_type: srcType,
        independent_of_subject: true,
        verification_method: 'Independent document verification'
      },
      fallback_sources: [{
        name: 'Secondary Regulatory Filing',
        source_type: 'sec_or_regulatory_filing',
        independent_of_subject: true,
        verification_method: 'Official filing verification'
      }],
      precedence_order: [
        srcType, 'audited_financials', 'bank_or_escrow_confirmation',
        'sec_or_regulatory_filing', 'official_platform_api', 'company_attestation', 'press_release'
      ],
      conflict_policy: 'use_highest_precedence_source',
      availability_policy: 'fallback_to_secondary_in_precedence_order',
      minimum_corroboration: 1
    };
  } else if (kind === 'temporal_and_fx') {
    currentSpec.observation.timezone = value.tz;
    currentSpec.observation.deadline_inclusivity = 'inclusive';
    currentSpec.observation.observation_mode = value.mode;
    currentSpec.observation.cutoff_precision = 'exact_second_utc';
    currentSpec.currency_policy = {
      reporting_currency: 'USD',
      fx_source: value.fx,
      fx_timestamp_rule: 'deadline_close',
      allow_non_reporting_currency: true
    };
    currentSpec.revision_policy = {
      corrections_until: null,
      restatement_window_days: 30,
      restatement_handling: 'apply_restatements_within_window',
      retroactive_unwind_handling: 'reverses_outcome_if_within_window'
    };
    currentSpec.subject.identifiers = { domain: currentSpec.subject.name.toLowerCase().replace(/\s+/g, '') + '.example' };
    currentSpec.invalidation_policy = {
      yes_condition_summary: 'Satisfies explicit specification rules by deadline.',
      no_condition_summary: 'Does not satisfy explicit specification rules by deadline.',
      invalid_triggers: ['source_unavailable_past_grace_period'],
      cancellation_policy: 'resolve_no'
    };
  }
  fixedCount += 1;
  refresh();
}

function nextAmbiguityStep() {
  const cp = currentSpec.predicate.class_policy;
  const remaining = [];

  if (cp.class === 'fundraising') {
    if (!cp.completion_event) remaining.push('completion event');
    if (!cp.allowed_instruments) remaining.push('financing types');
  } else if (cp.class === 'arr') {
    if (!cp.measurement_basis) remaining.push('ARR accounting basis');
    if (cp.include_services_revenue === null || cp.include_services_revenue === undefined) remaining.push('services & signed-not-started rules');
  } else if (cp.class === 'acquisition') {
    if (!cp.completion_event) remaining.push('completion event');
    if (!cp.earn_out_treatment) remaining.push('earn-out & consideration policy');
  }
  if (!currentSpec.evidence_policy || !currentSpec.evidence_policy.primary_source) {
    remaining.push('evidence source');
  }
  if (!currentSpec.observation.timezone || !currentSpec.currency_policy) {
    remaining.push('timezone, FX & revision policy');
  }

  if (cp.class === 'fundraising' && !cp.completion_event) {
    return {
      question: 'What does "raise" mean?',
      example: '$5M term sheet signed Dec 29; funds received Jan 3.',
      yesIf: 'signing controls',
      noIf: 'receipt of funds controls',
      missingRule: 'fundraising.completion_event',
      remaining: remaining.slice(1),
      choices: [
        { label: 'Agreement signed', fn: () => applyStepFix('completion_event', 'definitive_agreement_signed') },
        { label: 'Funds received', fn: () => applyStepFix('completion_event', 'funds_received_in_bank') },
        { label: 'Public announcement', fn: () => applyStepFix('completion_event', 'public_announcement') }
      ]
    };
  }
  if (cp.class === 'fundraising' && !cp.allowed_instruments) {
    return {
      question: 'Which financing types count toward the raise?',
      example: '$4M priced equity + $2M venture debt ($6M combined vs $4M equity-only).',
      yesIf: 'debt and credit lines count',
      noIf: 'only equity / SAFEs count',
      missingRule: 'fundraising.allowed_instruments',
      remaining: remaining.slice(1),
      choices: [
        { label: 'Priced equity only', fn: () => applyStepFix('allowed_instruments', ['priced_equity']) },
        { label: 'Equity + SAFEs', fn: () => applyStepFix('allowed_instruments', ['priced_equity', 'safe']) },
        { label: 'Equity + SAFEs + debt', fn: () => applyStepFix('allowed_instruments', ['priced_equity', 'safe', 'venture_debt']) }
      ]
    };
  }
  if (cp.class === 'arr' && !cp.measurement_basis) {
    return {
      question: 'What accounting basis defines ARR?',
      example: 'Contracted annual deals total $1.10M while billed annualized MRR is $940k.',
      yesIf: 'contracted recurring revenue controls',
      noIf: 'annualized MRR controls',
      missingRule: 'arr.measurement_basis',
      remaining: remaining.slice(1),
      choices: [
        { label: 'Contracted ARR', fn: () => applyStepFix('measurement_basis', 'contracted_recurring_revenue') },
        { label: 'Annualized MRR', fn: () => applyStepFix('measurement_basis', 'annualized_mrr') },
        { label: 'Billed ARR', fn: () => applyStepFix('measurement_basis', 'billed_recurring_revenue') }
      ]
    };
  }
  if (cp.class === 'arr' && (cp.include_services_revenue === null || cp.include_services_revenue === undefined)) {
    return {
      question: 'Do professional services & unstarted contracts count?',
      example: '$950k recurring SaaS + $100k annual implementation services.',
      yesIf: 'services are included',
      noIf: 'recurring software only',
      missingRule: 'arr.included_revenue',
      remaining: remaining.slice(1),
      choices: [
        { label: 'Software only (exclude services & unstarted)', fn: () => applyStepFix('arr_inclusions', { services: false, signedNotStarted: 'exclude_until_start_date' }) },
        { label: 'Include services', fn: () => applyStepFix('arr_inclusions', { services: true, signedNotStarted: 'exclude_until_start_date' }) }
      ]
    };
  }
  if (cp.class === 'acquisition' && !cp.earn_out_treatment) {
    return {
      question: 'Do contingent earn-outs count toward the $100M price?',
      example: '$80M cash at close + $30M contingent 2-year earn-out.',
      yesIf: 'total announced consideration counts',
      noIf: 'unconditional consideration only',
      missingRule: 'acquisition.earn_out_treatment',
      remaining: remaining.slice(1),
      choices: [
        { label: 'Exclude contingent earn-outs', fn: () => applyStepFix('acq_consideration', 'exclude_contingent_earn_outs') },
        { label: 'Include maximum earn-out', fn: () => applyStepFix('acq_consideration', 'include_maximum_earn_out') },
        { label: 'Fair value at close', fn: () => applyStepFix('acq_consideration', 'include_fair_value_at_close') }
      ]
    };
  }
  if (cp.class === 'acquisition' && !cp.completion_event) {
    return {
      question: 'Does acquisition announcement or legal close control?',
      example: 'Merger announced Dec 15; regulatory closing completes Feb 2.',
      yesIf: 'public announcement controls',
      noIf: 'legal close controls',
      missingRule: 'acquisition.completion_event',
      remaining: remaining.slice(1),
      choices: [
        { label: 'Legal close', fn: () => applyStepFix('acq_completion', 'legal_close') },
        { label: 'Agreement signed', fn: () => applyStepFix('acq_completion', 'definitive_agreement_signed') },
        { label: 'Public announcement', fn: () => applyStepFix('acq_completion', 'public_announcement') }
      ]
    };
  }
  if (!currentSpec.evidence_policy || !currentSpec.evidence_policy.primary_source) {
    const defaultSrc = cp.class === 'arr' ? 'audited_financials'
      : cp.class === 'fundraising' ? 'bank_or_escrow_confirmation'
      : 'sec_or_regulatory_filing';
    return {
      question: 'What evidence decides the outcome if sources disagree?',
      example: 'Press release reports a higher figure than the audited or bank record.',
      yesIf: 'the press release is treated as authoritative',
      noIf: 'independent records override press releases',
      missingRule: 'evidence.primary_source',
      remaining: remaining.slice(1),
      choices: [
        { label: 'Independent record + precedence order', fn: () => applyStepFix('evidence', defaultSrc) },
        { label: 'SEC / Regulatory filing first', fn: () => applyStepFix('evidence', 'sec_or_regulatory_filing') }
      ]
    };
  }
  if (!currentSpec.observation.timezone || !currentSpec.currency_policy) {
    const mode = cp.class === 'arr' ? 'point_in_time_at_deadline' : 'anytime_on_or_before_deadline';
    return {
      question: 'Which timezone, FX source, and restatement window apply?',
      example: '€4.8M wired at 23:58 local time (07:58 UTC the next day).',
      yesIf: 'local calendar day + favorable FX rate apply',
      noIf: 'UTC deadline + ECB reference rate apply',
      missingRule: 'observation.timezone / currency.fx_source',
      remaining: [],
      choices: [
        { label: 'UTC + ECB reference + 30d restatements', fn: () => applyStepFix('temporal_and_fx', { tz: 'UTC', fx: 'ecb_daily_reference', mode }) },
        { label: 'UTC + Fed H.10 + 30d restatements', fn: () => applyStepFix('temporal_and_fx', { tz: 'UTC', fx: 'federal_reserve_h10', mode }) }
      ]
    };
  }
  return null;
}

function toggleTechnical() {
  showTechnical = !showTechnical;
  render();
}

function render() {
  const card = document.getElementById('result-card');
  card.classList.remove('hidden');

  const rep = lastData.listability;
  const atk = lastData.attack;
  const step = nextAmbiguityStep();
  const isReady = rep.status === 'LISTABLE' && atk.ambiguous_count === 0;

  if (isReady || !step) {
    card.innerHTML = `
      <div class="status-pill ok">READY TO LIST</div>
      <div class="question">Resolution charter is deterministic.</div>
      <div style="font-size:14px;color:#374151;">
        0 of ${atk.total_scenarios} adversarial scenarios allow conflicting outcomes.
      </div>
      <div class="hash-box"><strong>Rule hash:</strong><br>${rep.rule_hash}</div>
      <button class="link-btn" onclick="toggleTechnical()">
        ${showTechnical ? 'Hide technical specification' : 'View technical specification'}
      </button>
      <div class="${showTechnical ? 'tech-panel' : 'hidden'}">
        <div class="label">Canonical Charter (YAML)</div>
        <pre>${escapeHtml(lastData.yaml)}</pre>
      </div>
    `;
    return;
  }

  const progress = fixedCount > 0
    ? `<div class="progress-note"><strong>${fixedCount} ambiguity fixed</strong>${step.remaining.length ? ' · Remaining: ' + step.remaining.join(', ') : ''}</div>`
    : `<div class="progress-note">${atk.ambiguous_count} of ${atk.total_scenarios} adversarial scenarios allow conflicting outcomes.</div>`;

  card.innerHTML = `
    <div class="status-pill bad">NOT READY TO LIST</div>
    ${progress}
    <div class="label">The biggest ambiguity</div>
    <div class="question">${escapeHtml(step.question)}</div>
    <div class="example-box">
      <div class="label">Example</div>
      ${escapeHtml(step.example)}
    </div>
    <div class="outcomes">
      <div class="outcome-box"><strong>YES</strong>if ${escapeHtml(step.yesIf)}</div>
      <div class="outcome-box"><strong>NO</strong>if ${escapeHtml(step.noIf)}</div>
    </div>
    <div class="label">Missing rule</div>
    <div class="missing-rule">${escapeHtml(step.missingRule)}</div>
    <div class="choices" id="step-choices"></div>
    <div style="margin-top:20px;">
      <button class="link-btn" onclick="toggleTechnical()">
        ${showTechnical ? 'Hide technical specification' : 'View technical specification'}
      </button>
    </div>
    <div class="${showTechnical ? 'tech-panel' : 'hidden'}">
      <div class="label">Canonical Specification (YAML)</div>
      <pre>${escapeHtml(lastData.yaml)}</pre>
    </div>
  `;

  const container = document.getElementById('step-choices');
  step.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.label;
    btn.onclick = c.fn;
    container.appendChild(btn);
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
